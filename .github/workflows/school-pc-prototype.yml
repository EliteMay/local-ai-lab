name: Build School PC Prototype

on:
  push:
    branches:
      - spike/school-pc-prototype
    paths:
      - 'spikes/school-pc-manager-prototype/**'
      - '.github/workflows/school-pc-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore app
        run: dotnet restore spikes/school-pc-manager-prototype/PcAgentPrototype.csproj

      - name: Restore IPC regression harness
        run: dotnet restore spikes/school-pc-manager-prototype/PcAgentPrototype.IpcRegression/PcAgentPrototype.IpcRegression.csproj

      - name: Build
        run: dotnet build spikes/school-pc-manager-prototype/PcAgentPrototype.csproj -c Release --no-restore

      - name: IPC regression test
        run: dotnet run --project spikes/school-pc-manager-prototype/PcAgentPrototype.IpcRegression/PcAgentPrototype.IpcRegression.csproj -c Release --no-restore

      - name: Publish single-file self-contained win-x64
        run: >-
          dotnet publish spikes/school-pc-manager-prototype/PcAgentPrototype.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/school-pc-prototype

      - name: Shutdown smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/school-pc-prototype/PcAgentPrototype.exe" -ArgumentList "--shutdown-self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "Shutdown smoke test failed with exit code $($p.ExitCode)"
          }

      - name: Show artifact files
        shell: pwsh
        run: Get-ChildItem -Recurse publish/school-pc-prototype | Select-Object FullName,Length

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: pc-agent-school-prototype-win-x64
          path: publish/school-pc-prototype/PcAgentPrototype.exe
          if-no-files-found: error
          retention-days: 7
