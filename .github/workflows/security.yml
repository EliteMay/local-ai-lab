name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 18 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    uses: EliteMay/.github/.github/workflows/reusable-javascript-security.yml@66ef0738c4557c4cf1f6b5831dce64083c2daa80
    with:
      fail-on-severity: high
