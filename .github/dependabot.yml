version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      electron-toolchain-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
